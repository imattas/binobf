name: Release binaries

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to package
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package:
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            os: windows-latest
          - platform: linux-x86_64
            os: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang lld ninja-build

      - name: Configure
        shell: bash
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DBINOBF_BUILD_TESTS=OFF
          -DBINOBF_WARNINGS_AS_ERRORS=ON

      - name: Build and install
        shell: bash
        run: |
          cmake --build build --parallel 2
          cmake --install build --prefix staging/binobf

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path staging/binobf/* -DestinationPath binobf-${{ matrix.platform }}.zip

      - name: Package Linux archive
        if: runner.os == 'Linux'
        shell: bash
        run: tar -C staging -czf binobf-${{ matrix.platform }}.tar.gz binobf

      - name: Create Windows integrity files
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "binobf-${{ matrix.platform }}.zip"
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content -NoNewline "$archive.sha256"
          @{ schema_version = 1; tag = "${{ github.ref_name }}"; commit = "${{ github.sha }}"; platform = "${{ matrix.platform }}"; archive = $archive; sha256 = $hash } | ConvertTo-Json -Compress | Set-Content "binobf-${{ matrix.platform }}.manifest.json"

      - name: Create Linux integrity files
        if: runner.os == 'Linux'
        shell: bash
        run: |
          archive="binobf-${{ matrix.platform }}.tar.gz"
          hash="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          printf '%s  %s\n' "$hash" "$archive" > "$archive.sha256"
          printf '{"schema_version":1,"tag":"%s","commit":"%s","platform":"%s","archive":"%s","sha256":"%s"}\n' "${{ github.ref_name }}" "${{ github.sha }}" "${{ matrix.platform }}" "$archive" "$hash" > "binobf-${{ matrix.platform }}.manifest.json"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: staging/binobf
          format: cyclonedx-json
          output-file: binobf-${{ matrix.platform }}.sbom.cdx.json
          upload-artifact: false

      - name: Attest archive
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: binobf-${{ matrix.platform }}.*

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: binobf-${{ matrix.platform }}
          path: |
            binobf-${{ matrix.platform }}.*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: binobf-*
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        shell: bash
        run: gh release create "$RELEASE_TAG" artifacts/* --verify-tag --generate-notes --repo "$GITHUB_REPOSITORY"
