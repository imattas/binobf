name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang lld ninja-build

      - name: Configure
        shell: bash
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DBINOBF_BUILD_TESTS=ON
          -DBINOBF_WARNINGS_AS_ERRORS=ON

      - name: Build
        shell: bash
        run: cmake --build build --parallel 2

      - name: Test
        shell: bash
        run: ctest --test-dir build --output-on-failure --parallel 2
